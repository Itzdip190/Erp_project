<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EducoErp Splash</title>
<style>
  :root{
    --blue-dark:#0B4DA2;
    --blue:#1565D8;
    --blue-light:#4F8EF7;
    --blue-pale:#EAF2FF;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--white);
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    user-select:none;
    -webkit-user-select:none;
  }
  
  .phone-container {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bg-arc{
    position:absolute;
    width:180vw;
    height:180vw;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, var(--blue-pale), transparent 70%);
    top:-40vw;
    left:-40vw;
    opacity:0;
    animation:fadeArc 1s ease-out forwards;
  }
  @keyframes fadeArc{ to{opacity:1;} }

  .stage{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index: 2;
  }

  .logo-wrap{
    width:110px;
    height:110px;
    border-radius:28px;
    background:linear-gradient(145deg, var(--blue-light), var(--blue-dark));
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 18px 40px rgba(21,101,216,0.45);
    transform:scale(0);
    opacity:0;
    animation:logoPop 900ms cubic-bezier(.34,1.56,.64,1) 150ms forwards;
  }
  @keyframes logoPop{
    0%{transform:scale(0) rotate(-20deg);opacity:0;}
    60%{transform:scale(1.12) rotate(4deg);opacity:1;}
    80%{transform:scale(0.96) rotate(-1deg);}
    100%{transform:scale(1) rotate(0deg);opacity:1;}
  }

  .logo-wrap svg{width:60px;height:60px;}

  .ring{
    position:absolute;
    width:110px;
    height:110px;
    border-radius:28px;
    border:2px solid var(--blue-light);
    opacity:0;
    animation:ringPulse 1600ms ease-out 900ms infinite;
  }
  @keyframes ringPulse{
    0%{transform:scale(1);opacity:.7;}
    100%{transform:scale(1.55);opacity:0;}
  }

  .brand{
    margin-top:24px;
    font-size:32px;
    font-weight:700;
    color:var(--blue-dark);
    letter-spacing:0.5px;
    opacity:0;
    transform:translateY(14px);
    animation:riseIn 600ms ease-out 950ms forwards;
  }
  .brand span{color:var(--blue-light);}

  .tagline{
    margin-top:8px;
    font-size:12px;
    color:#5c7aa8;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:0;
    transform:translateY(10px);
    animation:riseIn 600ms ease-out 1150ms forwards;
  }

  .dots{
    position:absolute;
    bottom:60px;
    display:flex;
    gap:8px;
    opacity:0;
    z-index: 2;
    animation:riseIn 500ms ease-out 1500ms forwards;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--blue);
    animation:bounce 1000ms ease-in-out infinite;
  }
  .dot:nth-child(2){animation-delay:150ms;background:var(--blue-light);}
  .dot:nth-child(3){animation-delay:300ms;background:var(--blue-dark);}
  @keyframes bounce{
    0%,80%,100%{transform:translateY(0);opacity:.4;}
    40%{transform:translateY(-8px);opacity:1;}
  }

  @keyframes riseIn{ to{opacity:1;transform:translateY(0);} }

  .reveal{
    position:absolute;
    inset:0;
    background:linear-gradient(160deg, var(--blue), var(--blue-dark));
    border-radius:50%;
    width:0;
    height:0;
    top:50%;
    left:50%;
    z-index: 3;
    transform:translate(-50%,-50%);
    animation:circleReveal 750ms cubic-bezier(.7,0,.2,1) 2500ms forwards;
  }
  @keyframes circleReveal{
    to{ width:300vw; height:300vh; border-radius:0; }
  }
</style>
</head>
<body>

<div class="phone-container">
  <div class="bg-arc"></div>
  <div class="stage">
    <div style="position:relative;display:flex;align-items:center;justify-content:center;">
      <div class="ring"></div>
      <div class="logo-wrap">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3L2 8L12 13L22 8L12 3Z" fill="white"/>
          <path d="M6 10.5V15.5C6 15.5 8.5 18 12 18C15.5 18 18 15.5 18 15.5V10.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 8V14" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <div class="brand">Educo<span>Erp</span></div>
    <div class="tagline">Smart School Management</div>
  </div>
  <div class="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <div class="reveal"></div>
</div>

<script>
  setTimeout(function() {
    if (window.AndroidBridge && window.AndroidBridge.onSplashComplete) {
      window.AndroidBridge.onSplashComplete();
    }
  }, 3100);
</script>

</body>
</html>
